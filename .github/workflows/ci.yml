name: build_test_publish

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # BUILD JOB - Compile and package
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install dependencies and build
        run: |
          echo "Building the application..."
          mvn clean install -DskipTests

      - name: Save JAR for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar

  # ==========================================
  # TEST JOB - Run automated tests
  # ==========================================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: |
          echo "Running tests..."
          mvn test

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports

  # ==========================================
  # PUBLISH JOB - Build and push Docker image
  # ==========================================
  publish:
    runs-on: ubuntu-latest
    needs: test
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - name: Check Docker Hub credentials
        id: docker-credentials
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping Docker Hub publish. Configure the DOCKER_USERNAME and DOCKER_TOKEN repository secrets to enable publishing."
          fi

      - name: Checkout code
        if: steps.docker-credentials.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Get JAR from the build job
        if: steps.docker-credentials.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        if: steps.docker-credentials.outputs.configured == 'true'
        run: |
          echo "Building Docker image..."
          docker build -t "$DOCKER_USERNAME/taskflow:latest" .

      - name: Push to Docker Hub
        if: steps.docker-credentials.outputs.configured == 'true'
        run: |
          echo "Logging in to Docker Hub..."
          printf '%s' "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
          echo "Pushing image to Docker Hub..."
          docker push "$DOCKER_USERNAME/taskflow:latest"